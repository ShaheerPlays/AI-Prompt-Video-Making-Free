<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generate AI Video | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#070B14;

color:white;

overflow-x:hidden;

}

header{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 40px;

background:#111827;

border-bottom:1px solid rgba(255,255,255,.08);

position:sticky;

top:0;

z-index:100;

}

.logo{

font-size:32px;

font-weight:bold;

color:#00D4FF;

}

nav{

display:flex;

gap:15px;

}

nav a{

color:white;

text-decoration:none;

padding:10px 18px;

border-radius:10px;

transition:.3s;

}

nav a:hover{

background:#00D4FF;

color:black;

}

.container{

max-width:1400px;

margin:auto;

padding:40px;

}

.title{

font-size:45px;

font-weight:bold;

margin-bottom:10px;

}

.subtitle{

color:#bfc8d8;

margin-bottom:35px;

}

.grid{

display:grid;

grid-template-columns:2fr 1fr;

gap:30px;

}

.left{

background:#111827;

padding:25px;

border-radius:20px;

}

.right{

background:#111827;

padding:25px;

border-radius:20px;

}

label{

display:block;

margin-top:18px;

margin-bottom:8px;

font-weight:600;

}

textarea{

width:100%;

height:220px;

padding:18px;

background:#1F2937;

border:none;

border-radius:15px;

color:white;

resize:none;

font-size:15px;

outline:none;

}

textarea::placeholder{

color:#94a3b8;

}

select,input{

width:100%;

padding:15px;

margin-top:8px;

background:#1F2937;

border:none;

border-radius:12px;

color:white;

font-size:15px;

}

button{

width:100%;

padding:18px;

margin-top:20px;

border:none;

border-radius:15px;

background:#00D4FF;

color:black;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-3px);

}

.option{

margin-top:20px;

padding:18px;

background:#1F2937;

border-radius:15px;

}

.preview{

margin-top:25px;

height:250px;

background:#1F2937;

border-radius:15px;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

color:#7dd3fc;

}

.progress{

margin-top:25px;

height:16px;

background:#333;

border-radius:20px;

overflow:hidden;

}

.progress-bar{

width:0%;

height:100%;

background:linear-gradient(90deg,#00D4FF,#7C3AED);

transition:.3s;

}

</style>

</head>

<body>

<header>

<div class="logo">

AI Studio

</div>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="projects.html">Projects</a>

<a href="settings.html">Settings</a>

<a href="profile.html">Profile</a>

</nav>

</header>

<div class="container">

<h1 class="title">

🎥 AI Video Generator

</h1>

<p class="subtitle">

Generate professional AI videos using text prompts or images.

</p>

<div class="grid">

<div class="left">

<label>Describe your video</label>

<textarea
id="prompt"
placeholder="Example: A cinematic documentary about Venus with realistic space scenes, AI narration, subtitles, and dramatic background music..."></textarea>

<label>Upload Images (Optional)</label>

<input
type="file"
accept="image/*"
multiple>

<label>Video Resolution</label>

<select>

<option>720P</option>

<option selected>1080P</option>

</select>

<label>Video Duration</label>

<select>

<option>30 Seconds</option>

<option>1 Minute</option>

<option>5 Minutes</option>

<option>10 Minutes</option>

<option>20 Minutes</option>

<option>30 Minutes</option>

</select>
