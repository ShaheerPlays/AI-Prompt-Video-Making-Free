<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#08101f,#101827,#1e3a8a);
color:white;
}

.card{

width:420px;

background:#111827;

padding:40px;

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.5);

text-align:center;

}

.logo{

font-size:35px;

font-weight:bold;

color:#00D4FF;

margin-bottom:10px;

}

.subtitle{

color:#bfc8d8;

margin-bottom:30px;

}

input{

width:100%;

padding:16px;

margin-bottom:18px;

border:none;

border-radius:12px;

background:#1f2937;

color:white;

font-size:16px;

text-align:center;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:12px;

background:#00D4FF;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

button:hover{

opacity:.9;

}

a{

display:block;

margin-top:18px;

color:#00D4FF;

text-decoration:none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

AI Studio

</div>

<div class="subtitle">

Unlock your account with your PIN

</div>

<form onsubmit="unlock(event)">

<input
type="email"
placeholder="Email"
required>

<input
type="password"
maxlength="6"
placeholder="6-Digit PIN"
required>

<button>

Unlock

</button>

</form>

<a href="login.html">

Login with Password

</a>

</div>

<script>

function unlock(e){

e.preventDefault();

window.location.href="dashboard.html";

}

</script>

</body>
</html>
