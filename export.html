<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Export Video | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#080B14;
color:white;
padding:40px;

}

.container{

max-width:900px;
margin:auto;

}

.logo{

font-size:35px;
font-weight:bold;
color:#00D4FF;
margin-bottom:30px;

}

.card{

background:#111827;
padding:35px;
border-radius:25px;

}

h1{

font-size:40px;
margin-bottom:10px;

}

p{

color:#cbd5e1;
margin-bottom:25px;

}

label{

display:block;
margin-top:20px;
margin-bottom:8px;
font-weight:bold;

}

select{

width:100%;
padding:15px;

background:#1F2937;

color:white;

border:none;

border-radius:12px;

}


button{

width:100%;

padding:17px;

margin-top:25px;

background:#00D4FF;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


button:hover{

transform:scale(1.03);

}


.progress{

height:18px;

background:#374151;

border-radius:20px;

overflow:hidden;

margin-top:25px;

}


.bar{

width:0%;

height:100%;

background:#00D4FF;

transition:.3s;

}


.status{

margin-top:20px;

background:#1F2937;

padding:20px;

border-radius:15px;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">

📤 AI Studio Export

</div>


<div class="card">


<h1>

Export Your Video

</h1>


<p>

Choose your final video quality and format.

</p>



<label>
Resolution
</label>


<select>

<option>720p HD</option>

<option selected>1080p Full HD</option>

</select>



<label>
Video Format
</label>


<select>

<option>MP4</option>

<option>MOV</option>

<option>WEBM</option>

</select>



<label>
Frame Rate
</label>


<select>

<option>24 FPS</option>

<option selected>30 FPS</option>

<option>60 FPS</option>

</select>



<label>
Quality
</label>


<select>

<option>Standard</option>

<option selected>High Quality</option>

<option>Ultra Quality</option>

</select>



<button onclick="exportVideo()">

🚀 Start Export

</button>



<div class="progress">

<div class="bar" id="bar"></div>

</div>



<div class="status" id="status">

Waiting for export...

</div>



<button>

📥 Download Video

</button>


</div>


</div>



<script>


function exportVideo(){

let bar=document.getElementById("bar");

let status=document.getElementById("status");

let progress=0;


status.innerHTML="Exporting video...";


let timer=setInterval(()=>{


progress+=5;

bar.style.width=progress+"%";


if(progress>=100){

clearInterval(timer);

status.innerHTML="✅ Export Complete";

}


},200);


}


</script>


</body>

</html>
