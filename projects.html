<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Projects</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b1020;
color:white;
padding:40px;
}

h1{
margin-bottom:10px;
font-size:42px;
}

p{
color:#9ca3af;
margin-bottom:35px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.card{
background:#151b2d;
border-radius:20px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px rgba(0,212,255,.3);
}

.thumbnail{
height:190px;
background:linear-gradient(135deg,#00d4ff,#7c3aed);
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
}

.info{
padding:20px;
}

.info h2{
margin-bottom:10px;
}

.info p{
margin-bottom:20px;
font-size:14px;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.edit{
background:#00d4ff;
color:black;
}

.download{
background:#22c55e;
color:white;
}

.delete{
background:#ef4444;
color:white;
}

</style>

</head>

<body>

<h1>📂 My Projects</h1>

<p>Your generated AI videos will appear here.</p>

<div class="grid">

<div class="card">

<div class="thumbnail">

🎬

</div>

<div class="info">

<h2>Venus Facts</h2>

<p>Generated • 1080P • 30 Seconds</p>

<div class="buttons">

<button class="edit">Edit</button>

<button class="download">Download</button>

<button class="delete">Delete</button>

</div>

</div>

</div>

<div class="card">

<div class="thumbnail">

🌍

</div>

<div class="info">

<h2>Earth Animation</h2>

<p>Generated • 4K • 1 Minute</p>

<div class="buttons">

<button class="edit">Edit</button>

<button class="download">Download</button>

<button class="delete">Delete</button>

</div>

</div>

</div>

</div>

</body>
</html>
