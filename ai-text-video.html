<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Text Video Creator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#080B14;
color:white;
padding:30px;

}


.container{

max-width:1200px;
margin:auto;

}


.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;

}


.logo{

font-size:35px;
font-weight:bold;
color:#00D4FF;

}


.back{

background:#1F2937;
padding:12px 20px;
border-radius:12px;
text-decoration:none;
color:white;

}



.grid{

display:grid;
grid-template-columns:2fr 1fr;
gap:25px;

}


.box{

background:#111827;
padding:30px;
border-radius:25px;

}


h1{

margin-bottom:15px;

}


label{

display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:bold;

}


textarea,
select,
input{

width:100%;
padding:15px;

background:#1F2937;

border:none;

border-radius:12px;

color:white;

}



textarea{

height:180px;
resize:none;

}



.preview{

height:250px;

background:#1F2937;

border-radius:20px;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}


.preview img{

max-width:100%;
max-height:100%;

}



button{

width:100%;

padding:17px;

margin-top:25px;

background:#00D4FF;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.progress{

height:18px;

background:#374151;

border-radius:20px;

margin-top:20px;

overflow:hidden;

}



.bar{

height:100%;

width:0%;

background:#00D4FF;

transition:.3s;

}


.status{

margin-top:20px;

padding:20px;

background:#1F2937;

border-radius:15px;

}



</style>

</head>


<body>


<div class="container">


<div class="header">


<div class="logo">

🎥 AI Video Studio

</div>


<a href="dashboard-new.html" class="back">

← Dashboard

</a>


</div>




<div class="grid">


<div class="box">


<h1>

Create AI Video

</h1>


<label>

Video Idea / Prompt

</label>


<textarea id="prompt"
placeholder="Example: Create a cinematic documentary about Mars..."></textarea>



<label>

Upload Image (Optional)

</label>


<input type="file" id="image" accept="image/*">



<label>

Resolution

</label>


<select>

<option>720p</option>

<option selected>1080p</option>

</select>



<label>

Duration

</label>


<select>

<option>30 Seconds</option>

<option>5 Minutes</option>

<option>10 Minutes</option>

<option>20 Minutes</option>

<option>30 Minutes</option>

</select>



<label>

AI Voice

</label>


<select>

<option>Male English</option>

<option>Female English</option>

<option>Male Urdu</option>

<option>Female Urdu</option>

</select>



<label>

Background Music

</label>


<select>

<option>No Music</option>

<option>Cinematic</option>

<option>Documentary</option>

<option>Adventure</option>

</select>



<label>

<input type="checkbox" checked>

Automatic Subtitles

</label>



<button onclick="generateVideo()">

🚀 Generate AI Video

</button>



<div class="progress">

<div class="bar" id="bar"></div>

</div>



<div class="status" id="status">

Waiting for generation...

</div>



</div>





<div class="box">


<h2>

Preview

</h2>


<br>


<div class="preview" id="preview">

🖼 Image Preview

</div>


</div>



</div>


</div>



<script>


document.getElementById("image").onchange=function(e){


let file=e.target.files[0];


if(file){


let img=document.createElement("img");

img.src=URL.createObjectURL(file);


document.getElementById("preview").innerHTML="";

document.getElementById("preview").appendChild(img);


}


}



function generateVideo(){


let prompt=document.getElementById("prompt").value;


if(prompt==""){

alert("Please write a video idea first!");

return;

}



let bar=document.getElementById("bar");

let status=document.getElementById("status");


let progress=0;


status.innerHTML="🤖 AI is creating your video...";



let timer=setInterval(()=>{


progress+=5;

bar.style.width=progress+"%";


if(progress>=100){


clearInterval(timer);


status.innerHTML="✅ Video Generated Successfully!";


}


},200);



}



</script>


</body>

</html>
