<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text To Video | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}


body{

background:#080B14;
color:white;
padding:30px;

}


.container{

max-width:1100px;
margin:auto;

}


.top{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;

}


.logo{

font-size:35px;
font-weight:bold;
color:#00D4FF;

}


.back{

background:#1F2937;
padding:12px 20px;
border-radius:12px;
color:white;
text-decoration:none;

}


.card{

background:#111827;
padding:35px;
border-radius:25px;

}


h1{

font-size:42px;
margin-bottom:10px;

}


p{

color:#cbd5e1;
margin-bottom:25px;

}


label{

display:block;
margin-top:20px;
margin-bottom:8px;
font-weight:bold;

}


textarea{

width:100%;
height:200px;

padding:20px;

background:#1F2937;

border:none;

border-radius:15px;

color:white;

font-size:16px;

resize:none;

}



select,input{

width:100%;

padding:15px;

background:#1F2937;

color:white;

border:none;

border-radius:12px;

}



.options{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}



button{

width:100%;

padding:18px;

margin-top:30px;

background:#00D4FF;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



button:hover{

transform:scale(1.03);

}



.status{

margin-top:25px;

background:#1F2937;

padding:20px;

border-radius:15px;

}


</style>


</head>


<body>


<div class="container">


<div class="top">


<div class="logo">

🎥 AI Studio

</div>


<a href="dashboard.html" class="back">

← Dashboard

</a>


</div>



<div class="card">


<h1>

Text To Video

</h1>


<p>

Describe your idea and create an AI video.

</p>



<label>

Video Prompt

</label>


<textarea id="prompt"
placeholder="Example: Create a cinematic documentary about the planets..."></textarea>




<div class="options">


<div>

<label>

Duration

</label>


<select>

<option>30 Seconds</option>

<option>5 Minutes</option>

<option>10 Minutes</option>

<option>20 Minutes</option>

<option>30 Minutes</option>

</select>

</div>



<div>

<label>

Quality

</label>


<select>

<option>720p</option>

<option selected>1080p</option>

</select>

</div>



<div>

<label>

AI Voice

</label>


<select>

<option>Male English</option>

<option>Female English</option>

<option>Male Urdu</option>

<option>Female Urdu</option>

</select>

</div>



<div>

<label>

Music

</label>


<select>

<option>No Music</option>

<option>Cinematic</option>

<option>Documentary</option>

<option>Adventure</option>

</select>

</div>


</div>



<label>

<input type="checkbox" checked>

Automatic Subtitles

</label>



<button onclick="createVideo()">

🚀 Generate Video

</button>



<div class="status" id="status">

Waiting for your prompt...

</div>



</div>


</div>



<script>


function createVideo(){


let prompt=document.getElementById("prompt").value;


if(prompt==""){

alert("Please enter a video idea.");

return;

}


document.getElementById("status").innerHTML=

"⏳ AI is preparing your video...";


setTimeout(()=>{


document.getElementById("status").innerHTML=

"✅ Video created successfully!";


},3000);



}


</script>


</body>

</html>
