<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#0B1020,#101827,#1E3A8A);

overflow:hidden;

}

.card{

width:460px;

padding:40px;

background:rgba(18,25,40,.9);

backdrop-filter:blur(15px);

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.4);

}

.logo{

text-align:center;

font-size:34px;

font-weight:bold;

color:#00D4FF;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#cbd5e1;

margin-bottom:30px;

}

input{

width:100%;

padding:16px;

margin-bottom:18px;

background:#111827;

border:none;

border-radius:12px;

color:white;

font-size:15px;

}

button{

width:100%;

padding:16px;

background:#00D4FF;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

button:hover{

opacity:.9;

}

.bottom{

margin-top:20px;

text-align:center;

}

.bottom a{

color:#00D4FF;

text-decoration:none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

AI Studio

</div>

<div class="subtitle">

Create your free account

</div>

<form onsubmit="signup(event)">

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email"
required>

<input
type="password"
placeholder="Password"
required>

<input
type="password"
placeholder="Confirm Password"
required>

<button type="submit">

Create Account

</button>

</form>

<div class="bottom">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

<script>

function signup(e){

e.preventDefault();

alert("Account Created Successfully!");

window.location.href="dashboard.html";

}

</script>

</body>
</html>
