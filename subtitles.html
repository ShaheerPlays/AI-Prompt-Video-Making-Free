<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Subtitle Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#070B14;
color:white;
padding:40px;

}

.container{

max-width:1100px;
margin:auto;

}

.logo{

font-size:35px;
font-weight:bold;
color:#00D4FF;
margin-bottom:25px;

}

.card{

background:#111827;
padding:35px;
border-radius:25px;

}

h1{

font-size:40px;
margin-bottom:10px;

}

p{

color:#cbd5e1;
margin-bottom:25px;

}

label{

display:block;
margin-top:20px;
margin-bottom:8px;
font-weight:600;

}

textarea,input,select{

width:100%;

padding:15px;

background:#1F2937;

border:none;

border-radius:12px;

color:white;

font-size:15px;

}


textarea{

height:180px;

resize:none;

}


button{

width:100%;

padding:17px;

margin-top:25px;

background:#00D4FF;

color:black;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


button:hover{

transform:scale(1.02);

}


.preview{

margin-top:30px;

height:250px;

background:#000;

border-radius:15px;

display:flex;

justify-content:center;

align-items:center;

font-size:25px;

text-align:center;

}


.subtitle-text{

color:white;

background:rgba(0,0,0,.6);

padding:10px 20px;

border-radius:10px;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">

📝 AI Studio

</div>


<div class="card">


<h1>

AI Subtitle Generator

</h1>


<p>

Create automatic subtitles for your AI videos.

</p>



<label>

Upload Video

</label>


<input type="file" accept="video/*">



<label>

Subtitle Language

</label>


<select>

<option>English</option>

<option>Urdu</option>

<option>Hindi</option>

<option>Arabic</option>

<option>Spanish</option>

</select>



<label>

Subtitle Text (Demo)

</label>


<textarea id="subtitle"
placeholder="Your subtitles will appear here..."></textarea>



<label>

Subtitle Style

</label>


<select>

<option>Modern</option>

<option>Bold</option>

<option>Minimal</option>

<option>Cinematic</option>

</select>



<button onclick="generateSubtitle()">

✨ Generate Subtitles

</button>



<div class="preview">

<div class="subtitle-text" id="previewText">

Your subtitle preview

</div>

</div>



</div>


</div>



<script>


function generateSubtitle(){

let text=document.getElementById("subtitle").value;


if(text==""){

text="Hello! This is an AI generated subtitle.";

}


document.getElementById("previewText").innerHTML=text;


}


</script>


</body>

</html>
