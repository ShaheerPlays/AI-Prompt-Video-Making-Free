<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to Video - AI Video Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b1020;
color:white;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
font-size:42px;
margin-bottom:10px;
}

p{
color:#b0b8d1;
margin-bottom:30px;
}

.upload-box{
border:3px dashed #00d4ff;
border-radius:20px;
padding:50px;
text-align:center;
background:#151b2d;
cursor:pointer;
transition:.3s;
}

.upload-box:hover{
background:#1d2640;
}

.upload-box input{
display:none;
}

.preview{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
margin-top:30px;
}

.preview img{
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
border:2px solid #00d4ff;
}

.controls{
margin-top:30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

select{
padding:15px;
border:none;
border-radius:12px;
background:#151b2d;
color:white;
}

button{
margin-top:30px;
padding:16px 35px;
background:#00d4ff;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.progress{
margin-top:30px;
height:15px;
background:#222;
border-radius:20px;
overflow:hidden;
}

.progress div{
height:100%;
width:0%;
background:linear-gradient(90deg,#00d4ff,#7c3aed);
transition:.3s;
}

</style>

</head>

<body>

<div class="container">

<h1>🖼 Image → Video</h1>

<p>Upload multiple images and turn them into an AI video.</p>

<label class="upload-box">

<h2>📸 Click to Upload Images</h2>

<p>PNG, JPG, JPEG supported</p>

<input
type="file"
id="images"
accept="image/*"
multiple>

</label>

<div class="preview" id="preview"></div>

<div class="controls">

<select>
<option>1080P</option>
<option>2K</option>
<option>4K</option>
</select>

<select>
<option>Fade</option>
<option>Zoom</option>
<option>Slide</option>
<option>None</option>
</select>

<select>
<option>5 Seconds/Image</option>
<option>10 Seconds/Image</option>
<option>15 Seconds/Image</option>
</select>

</div>

<button onclick="generateVideo()">

Generate Video

</button>

<div class="progress">

<div id="bar"></div>

</div>

</div>

<script>

const input=document.getElementById("images");

const preview=document.getElementById("preview");

input.addEventListener("change",()=>{

preview.innerHTML="";

[...input.files].forEach(file=>{

const reader=new FileReader();

reader.onload=e=>{

const img=document.createElement("img");

img.src=e.target.result;

preview.appendChild(img);

}

reader.readAsDataURL(file);

});

});

function generateVideo(){

let width=0;

const bar=document.getElementById("bar");

const timer=setInterval(()=>{

width+=4;

bar.style.width=width+"%";

if(width>=100){

clearInterval(timer);

alert("Later this will connect to the AI video generator.");

}

},150);

}

</script>

</body>
</html>
