<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Voice Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#070B14;
color:white;
padding:40px;

}

.container{

max-width:1000px;
margin:auto;

}

.logo{

font-size:35px;
font-weight:bold;
color:#00D4FF;
margin-bottom:25px;

}

.card{

background:#111827;
padding:35px;
border-radius:25px;

}

h1{

font-size:40px;
margin-bottom:10px;

}

p{

color:#cbd5e1;
margin-bottom:25px;

}

label{

display:block;
margin-top:20px;
margin-bottom:8px;
font-weight:600;

}

textarea{

width:100%;
height:180px;

padding:18px;

background:#1F2937;

border:none;

border-radius:15px;

color:white;

font-size:16px;

resize:none;

}

select{

width:100%;

padding:15px;

background:#1F2937;

color:white;

border:none;

border-radius:12px;

}

button{

width:100%;

padding:17px;

margin-top:25px;

background:#00D4FF;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

button:hover{

transform:scale(1.02);

}

.audio-box{

margin-top:30px;

background:#1F2937;

padding:25px;

border-radius:15px;

text-align:center;

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
🎙 AI Studio
</div>


<div class="card">


<h1>
AI Voice Generator
</h1>


<p>
Create realistic AI narration for your videos.
</p>


<label>
Narration Text
</label>


<textarea id="text"
placeholder="Write your video narration here..."></textarea>



<label>
Voice Type
</label>


<select>

<option>Male - English</option>

<option>Female - English</option>

<option>Male - Urdu</option>

<option>Female - Urdu</option>

</select>



<label>
Voice Style
</label>


<select>

<option>Professional</option>

<option>Documentary</option>

<option>Friendly</option>

<option>Dramatic</option>

<option>News</option>

</select>



<button onclick="createVoice()">

🎙 Generate Voice

</button>



<div class="audio-box" id="result">

Audio preview will appear here.

</div>



</div>


</div>



<script>

function createVoice(){

let text=document.getElementById("text").value;

if(text==""){

alert("Enter narration text first");

return;

}


document.getElementById("result").innerHTML=

"✅ Voice generated successfully<br><br>"+
"Text: "+text;


}

</script>


</body>

</html>
