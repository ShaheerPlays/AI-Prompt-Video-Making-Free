<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#080B14;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


.card{

width:420px;
background:#111827;
padding:35px;
border-radius:25px;
text-align:center;

}


.avatar{

width:90px;
height:90px;
background:#00D4FF;
color:black;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold;
margin:auto;

}


h1{

margin-top:20px;

}


.info{

background:#1F2937;
padding:15px;
border-radius:12px;
margin-top:15px;
text-align:left;

}


button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:#00D4FF;
font-weight:bold;
cursor:pointer;

}


.logout{

background:#ef4444;
color:white;

}


a{

display:block;
margin-top:20px;
color:#00D4FF;
text-decoration:none;

}


</style>

</head>


<body>


<div class="card">


<div class="avatar" id="avatar">

U

</div>


<h1 id="name">

User

</h1>



<div class="info">

Username:
<span id="username"></span>

</div>



<div class="info">

Email:
<span id="email"></span>

</div>



<button onclick="logout()">

🚪 Logout

</button>



<a href="dashboard-new.html">

← Back to Dashboard

</a>


</div>



<script>


let username=localStorage.getItem("username");

let email=localStorage.getItem("email");


if(!username){

window.location="signin.html";

}


document.getElementById("username").innerHTML=username;

document.getElementById("name").innerHTML=username;

document.getElementById("avatar").innerHTML=
username.charAt(0).toUpperCase();


document.getElementById("email").innerHTML=email;



function logout(){

localStorage.clear();

window.location="signin.html";

}


</script>


</body>

</html>
