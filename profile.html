<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#090B15;
color:white;
}

.header{
background:#111827;
padding:25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:30px;
font-weight:bold;
color:#00D4FF;
}

.back{
background:#00D4FF;
color:black;
padding:12px 20px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:40px;
}

.profile{
display:flex;
align-items:center;
gap:30px;
background:#151b2d;
padding:30px;
border-radius:20px;
margin-bottom:30px;
}

.avatar{
width:130px;
height:130px;
border-radius:50%;
background:#00D4FF;
display:flex;
justify-content:center;
align-items:center;
font-size:55px;
font-weight:bold;
color:black;
}

.info h2{
font-size:34px;
margin-bottom:10px;
}

.info p{
color:#cbd5e1;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#151b2d;
padding:25px;
border-radius:18px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(0,212,255,.3);
}

.card h1{
font-size:40px;
color:#00D4FF;
margin-bottom:10px;
}

.projects{
margin-top:40px;
}

.project{
background:#151b2d;
padding:20px;
border-radius:15px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
padding:12px 18px;
background:#00D4FF;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<div class="logo">
AI Studio
</div>

<a href="dashboard.html" class="back">
Dashboard
</a>

</div>

<div class="container">

<div class="profile">

<div class="avatar">
S
</div>

<div class="info">

<h2>Muhammad Shaheer</h2>

<p>AI Creator</p>

<p>Joined 2026</p>

</div>

</div>

<div class="stats">

<div class="card">

<h1>18</h1>

<p>Videos Created</p>

</div>

<div class="card">

<h1>12</h1>

<p>Projects Saved</p>

</div>

<div class="card">

<h1>1080P</h1>

<p>Preferred Quality</p>

</div>

<div class="card">

<h1>30 Min</h1>

<p>Maximum Duration</p>

</div>

</div>

<div class="projects">

<h2 style="margin-bottom:20px;">Recent Projects</h2>

<div class="project">

<span>🌍 Facts About Venus</span>

<button>Edit</button>

</div>

<div class="project">

<button>Edit</button>

</div>

</div>

</div>

</div>

</body>
</html>
