<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | AI Video Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#090B15,#111827,#1d4ed8);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:700px;

height:700px;

background:rgba(0,212,255,.15);

filter:blur(120px);

border-radius:50%;

animation:move 10s infinite alternate;

}

@keyframes move{

from{
transform:translate(-150px,-100px);
}

to{
transform:translate(150px,120px);
}

}

.login{

position:relative;

width:420px;

background:rgba(20,25,40,.85);

backdrop-filter:blur(20px);

padding:40px;

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.4);

}

.logo{

font-size:34px;

font-weight:700;

text-align:center;

color:#00d4ff;

margin-bottom:8px;

}

.subtitle{

text-align:center;

color:#cbd5e1;

margin-bottom:30px;

}

input{

width:100%;

padding:16px;

margin-bottom:18px;

border:none;

border-radius:12px;

background:#111827;

color:white;

font-size:15px;

outline:none;

}

button{

width:100%;

padding:16px;

background:#00d4ff;

color:black;

border:none;

border-radius:12px;

font-size:18px;

font-weight:700;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.03);

}

.links{

margin-top:18px;

display:flex;

justify-content:space-between;

}

.links a{

color:#00d4ff;

text-decoration:none;

font-size:14px;

}

</style>

</head>

<body>

<div class="login">

<div class="logo">

AI Studio

</div>

<div class="subtitle">

Sign in to continue

</div>

<form onsubmit="login(event)">

<input
type="email"
placeholder="Email"
required>

<input
type="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<div class="links">

<a href="signup.html">

Create Account

</a>

<a href="#">

Forgot Password?

</a>

</div>

</div>

<script>

function login(e){

e.preventDefault();

window.location.href="dashboard.html";

}

</script>

</body>
</html>
