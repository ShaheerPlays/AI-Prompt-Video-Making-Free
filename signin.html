<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#080B14;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;

}


.box{

width:400px;
background:#111827;
padding:35px;
border-radius:25px;

}


.logo{

text-align:center;
font-size:32px;
font-weight:bold;
color:#00D4FF;
margin-bottom:20px;

}


h1{

text-align:center;
margin-bottom:25px;

}


input{

width:100%;
padding:15px;
margin-top:15px;

background:#1F2937;

border:none;

border-radius:12px;

color:white;

font-size:15px;

}


button{

width:100%;

padding:16px;

margin-top:25px;

background:#00D4FF;

border:none;

border-radius:12px;

font-weight:bold;

font-size:17px;

cursor:pointer;

}


button:hover{

transform:scale(1.03);

}


a{

display:block;

text-align:center;

margin-top:20px;

color:#00D4FF;

text-decoration:none;

}


</style>

</head>


<body>


<div class="box">


<div class="logo">

🤖 AI Studio

</div>


<h1>

Login

</h1>



<input id="username" placeholder="Username">



<input id="pin" type="password" placeholder="Enter PIN">



<button onclick="login()">

🔓 Login

</button>



<a href="register.html">

Create New Account

</a>



</div>



<script>


function login(){


let username=document.getElementById("username").value;

let pin=document.getElementById("pin").value;


let savedUser=localStorage.getItem("username");

let savedPin=localStorage.getItem("pin");



if(username===savedUser && pin===savedPin){


alert("Login successful!");

window.location="dashboard.html";


}

else{


alert("Wrong username or PIN!");

}


}


</script>


</body>

</html>
