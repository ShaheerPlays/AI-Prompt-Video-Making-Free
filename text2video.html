<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Video - AI Video Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b1020;
color:white;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
font-size:42px;
margin-bottom:10px;
}

.subtitle{
color:#9ca3af;
margin-bottom:30px;
}

.panel{
background:#151b2d;
border-radius:20px;
padding:25px;
margin-bottom:25px;
}

textarea{
width:100%;
height:220px;
background:#0f172a;
border:none;
outline:none;
color:white;
padding:20px;
border-radius:15px;
resize:none;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

select,input{
width:100%;
padding:15px;
background:#0f172a;
border:none;
border-radius:12px;
color:white;
}

button{
margin-top:25px;
padding:16px 35px;
background:#00d4ff;
color:black;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.progress{
margin-top:30px;
height:16px;
background:#1f2937;
border-radius:20px;
overflow:hidden;
}

.progress div{
height:100%;
width:0%;
background:linear-gradient(90deg,#00d4ff,#7c3aed);
transition:.5s;
}

video{
margin-top:30px;
width:100%;
border-radius:20px;
background:black;
display:none;
}

</style>
</head>

<body>

<div class="container">

<h1>🎥 Text → Video</h1>

<p class="subtitle">
Describe your idea and let AI generate a video.
</p>

<div class="panel">

<textarea
id="prompt"
placeholder="Example: A futuristic city at sunset with flying cars and cinematic camera movement..."></textarea>

<div class="grid">

<div>
<label>Quality</label>
<select>
<option>720P</option>
<option selected>1080P</option>
<option>2K</option>
<option>4K</option>
</select>
</div>

<div>
<label>Aspect Ratio</label>
<select>
<option>16:9</option>
<option>9:16</option>
<option>1:1</option>
</select>
</div>

<div>
<label>Duration</label>
<select>
<option>10 Seconds</option>
<option>30 Seconds</option>
<option>1 Minute</option>
<option>5 Minutes</option>
<option>10 Minutes</option>
<option>30 Minutes</option>
<option>1 Hour</option>
</select>
</div>

<div>
<label>Style</label>
<select>
<option>Realistic</option>
<option>Cinematic</option>
<option>Anime</option>
<option>Cartoon</option>
<option>Fantasy</option>
</select>
</div>

</div>

<button onclick="generateVideo()">
Generate Video
</button>

<div class="progress">
<div id="bar"></div>
</div>

<video id="preview" controls></video>

</div>

</div>

<script>

function generateVideo(){

const bar=document.getElementById("bar");

let width=0;

const timer=setInterval(()=>{

width+=5;

bar.style.width=width+"%";

if(width>=100){

clearInterval(timer);

alert("Later this button will connect to your AI backend.");

}

},200);

}

</script>

</body>
</html>
