<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}


body{

background:#080B14;
color:white;
padding:40px;

}


.container{

max-width:900px;
margin:auto;

}


.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;

}


.logo{

font-size:35px;
font-weight:bold;
color:#00D4FF;

}


.back{

background:#1F2937;
padding:12px 20px;
border-radius:12px;
color:white;
text-decoration:none;

}


.card{

background:#111827;
padding:30px;
border-radius:25px;
margin-bottom:25px;

}


h1{

margin-bottom:20px;

}


h2{

color:#00D4FF;
margin-bottom:15px;

}


label{

display:block;
margin-top:15px;
margin-bottom:8px;

}


input,select{

width:100%;
padding:15px;

background:#1F2937;

border:none;

border-radius:12px;

color:white;

}



button{

width:100%;
padding:16px;

margin-top:20px;

background:#00D4FF;

border:none;

border-radius:12px;

font-weight:bold;

font-size:16px;

cursor:pointer;

}


button:hover{

transform:scale(1.03);

}


</style>

</head>


<body>


<div class="container">


<div class="header">


<div class="logo">

⚙ AI Studio Settings

</div>


<a href="dashboard-new.html" class="back">

← Dashboard

</a>


</div>




<div class="card">


<h1>

Account Settings

</h1>


<label>

Username

</label>

<input id="username" readonly>



<label>

Email

</label>

<input id="email" readonly>


</div>





<div class="card">


<h2>

🎥 Video Defaults

</h2>


<label>

Default Resolution

</label>


<select>

<option>720p</option>

<option selected>1080p</option>

</select>



<label>

Default Duration

</label>


<select>

<option>5 Minutes</option>

<option>10 Minutes</option>

<option>30 Minutes</option>

</select>



<label>

Default Voice

</label>


<select>

<option>Male English</option>

<option>Female English</option>

<option>Male Urdu</option>

<option>Female Urdu</option>

</select>


</div>





<div class="card">


<h2>

🔔 Preferences

</h2>


<label>

<input type="checkbox" checked>

 Enable Notifications

</label>



<label>

<input type="checkbox" checked>

 Auto Save Projects

</label>



<button onclick="saveSettings()">

💾 Save Settings

</button>


</div>


</div>




<script>


document.getElementById("username").value =
localStorage.getItem("username") || "User";


document.getElementById("email").value =
localStorage.getItem("email") || "No email";



function saveSettings(){

alert("Settings saved successfully!");

}


</script>



</body>

</html>
