<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library | AI Studio</title>

<style>

body{

background:#080B14;
color:white;
font-family:Arial,sans-serif;
padding:30px;

}


h1{

color:#00D4FF;

}


.card{

background:#111827;
padding:20px;
margin-top:20px;
border-radius:15px;

}


button{

padding:12px 20px;
background:#00D4FF;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;

}


</style>

</head>


<body>


<h1>📂 AI Video Library</h1>


<a href="dashboard-new.html">

<button>
← Dashboard
</button>

</a>



<div id="projects">

Loading projects...

</div>



<script>


let savedProjects = JSON.parse(

localStorage.getItem("projects") || "[]"

);



let container=document.getElementById("projects");



if(savedProjects.length===0){


container.innerHTML=

"No projects created yet.";


}

else{


container.innerHTML="";


savedProjects.forEach(project=>{


container.innerHTML += `

<div class="card">

<h2>
🎥 ${project.prompt}
</h2>

<p>
Quality: ${project.quality}
</p>

<p>
Duration: ${project.duration}
</p>

<p>
Voice: ${project.voice}
</p>

</div>

`;


});


}


</script>


</body>

</html>
