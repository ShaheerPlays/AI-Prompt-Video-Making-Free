<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Media Library | AI Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#080B14;
color:white;
padding:40px;

}

.container{

max-width:1200px;
margin:auto;

}

.logo{

font-size:35px;
font-weight:bold;
color:#00D4FF;
margin-bottom:25px;

}

.top{

display:flex;
justify-content:space-between;
gap:20px;
margin-bottom:30px;

}

input{

flex:1;
padding:15px;

background:#1F2937;

border:none;

border-radius:12px;

color:white;

font-size:16px;

}


button{

padding:15px 25px;

background:#00D4FF;

border:none;

border-radius:12px;

font-weight:bold;

cursor:pointer;

}


.library{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:25px;

}


.card{

background:#111827;

padding:25px;

border-radius:20px;

transition:.3s;

}


.card:hover{

transform:translateY(-5px);

box-shadow:0 0 20px rgba(0,212,255,.3);

}


.thumbnail{

height:150px;

background:#1F2937;

border-radius:15px;

display:flex;

justify-content:center;

align-items:center;

font-size:50px;

margin-bottom:20px;

}


.card h2{

margin-bottom:10px;

}


.card p{

color:#cbd5e1;

}


.actions{

display:flex;

gap:10px;

margin-top:20px;

}


.actions button{

width:50%;

padding:12px;

}


.delete{

background:#ef4444;

color:white;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">

📂 AI Studio Library

</div>



<div class="top">


<input placeholder="Search projects...">


<button>

➕ New Project

</button>


</div>



<div class="library">



<div class="card">

<div class="thumbnail">

🎥

</div>

<h2>

Facts About Venus

</h2>

<p>

AI Documentary • 1080P

</p>

<div class="actions">

<button>
Open
</button>

<button class="delete">
Delete
</button>

</div>

</div>




<div class="card">

<div class="thumbnail">

🌌

</div>

<h2>

Space Adventure

</h2>

<p>

AI Video • 30 Minutes

</p>

<div class="actions">

<button>
Open
</button>

<button class="delete">
Delete
</button>

</div>

</div>




<div class="card">

<div class="thumbnail">

🎙

</div>

<h2>

Voice Narration

</h2>

<p>

AI Voice File

</p>

<div class="actions">

<button>
Play
</button>

<button class="delete">
Delete
</button>

</div>

</div>



</div>


</div>


</body>

</html>
